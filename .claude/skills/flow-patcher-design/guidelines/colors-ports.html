<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--fp-bg-0);color:var(--fp-fg-1);font-family:var(--fp-font-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px;width:96px}.chip{height:56px;border-radius:8px;border:1px solid var(--fp-line-1)}
.n{font-size:12px;font-weight:500}.t{font-family:var(--fp-font-mono);font-size:10px;color:var(--fp-fg-4)}.m{font-family:var(--fp-font-mono)}
.grid{display:grid;grid-template-columns:160px 1fr;gap:12px 20px;align-items:baseline}</style></head><body>
<div class="row"><div class="sw" style="width:100px"><div class="chip" style="background:var(--fp-event);border:0"></div><div class="n" style="color:var(--fp-event)">Event</div><div class="t">--fp-event</div></div><div class="sw" style="width:100px"><div class="chip" style="background:var(--fp-note);border:0"></div><div class="n" style="color:var(--fp-note)">Note</div><div class="t">--fp-note</div></div><div class="sw" style="width:100px"><div class="chip" style="background:var(--fp-signal);border:0"></div><div class="n" style="color:var(--fp-signal)">Signal</div><div class="t">--fp-signal</div></div><div class="sw" style="width:100px"><div class="chip" style="background:var(--fp-audio);border:0"></div><div class="n" style="color:var(--fp-audio)">Audio</div><div class="t">--fp-audio</div></div><div class="sw" style="width:100px"><div class="chip" style="background:var(--fp-field);border:0"></div><div class="n" style="color:var(--fp-field)">Field</div><div class="t">--fp-field</div></div><div class="sw" style="width:100px"><div class="chip" style="background:var(--fp-value);border:0"></div><div class="n" style="color:var(--fp-value)">Value</div><div class="t">--fp-value</div></div></div></body></html>
