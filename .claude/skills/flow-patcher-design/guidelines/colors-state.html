<!-- @dsCard group="Colors" viewport="700x110" name="State" subtitle="Selection, error, warning" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--fp-bg-0);color:var(--fp-fg-1);font-family:var(--fp-font-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px;width:96px}.chip{height:56px;border-radius:8px;border:1px solid var(--fp-line-1)}
.n{font-size:12px;font-weight:500}.t{font-family:var(--fp-font-mono);font-size:10px;color:var(--fp-fg-4)}.m{font-family:var(--fp-font-mono)}
.grid{display:grid;grid-template-columns:160px 1fr;gap:12px 20px;align-items:baseline}</style></head><body>
<div class="row" style="gap:12px"><div style="display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:8px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);min-width:200px"><span style="width:28px;height:28px;border-radius:6px;box-shadow:0 0 0 1.5px var(--fp-select);background:var(--fp-bg-2)"></span><div><div class="n">Selection</div><div class="t">--fp-select</div></div></div><div style="display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:8px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);min-width:200px"><span style="width:28px;height:28px;border-radius:6px;background:var(--fp-error-soft);border:1px solid var(--fp-error)"></span><div><div class="n">Error</div><div class="t">--fp-error</div></div></div><div style="display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:8px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);min-width:200px"><span style="width:28px;height:28px;border-radius:6px;background:var(--fp-warn-soft);border:1px solid var(--fp-warn)"></span><div><div class="n">Warning</div><div class="t">--fp-warn</div></div></div></div></body></html>
