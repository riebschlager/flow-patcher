<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--fp-bg-0);color:var(--fp-fg-1);font-family:var(--fp-font-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px;width:96px}.chip{height:56px;border-radius:8px;border:1px solid var(--fp-line-1)}
.n{font-size:12px;font-weight:500}.t{font-family:var(--fp-font-mono);font-size:10px;color:var(--fp-fg-4)}.m{font-family:var(--fp-font-mono)}
.grid{display:grid;grid-template-columns:160px 1fr;gap:12px 20px;align-items:baseline}</style></head><body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--fp-bg-0)"></div><div class="n">Canvas</div><div class="t">--fp-bg-0</div></div><div class="sw"><div class="chip" style="background:var(--fp-bg-1)"></div><div class="n">Chrome</div><div class="t">--fp-bg-1</div></div><div class="sw"><div class="chip" style="background:var(--fp-bg-2)"></div><div class="n">Node</div><div class="t">--fp-bg-2</div></div><div class="sw"><div class="chip" style="background:var(--fp-bg-3)"></div><div class="n">Raised</div><div class="t">--fp-bg-3</div></div><div class="sw"><div class="chip" style="background:var(--fp-bg-4)"></div><div class="n">Pressed</div><div class="t">--fp-bg-4</div></div><div class="sw"><div class="chip" style="background:var(--fp-line-2)"></div><div class="n">Line</div><div class="t">--fp-line-2</div></div></div></body></html>
