<!-- @dsCard group="Spacing" viewport="700x120" name="Elevation" subtitle="Inset → node → popover" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--fp-bg-0);color:var(--fp-fg-1);font-family:var(--fp-font-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px;width:96px}.chip{height:56px;border-radius:8px;border:1px solid var(--fp-line-1)}
.n{font-size:12px;font-weight:500}.t{font-family:var(--fp-font-mono);font-size:10px;color:var(--fp-fg-4)}.m{font-family:var(--fp-font-mono)}
.grid{display:grid;grid-template-columns:160px 1fr;gap:12px 20px;align-items:baseline}</style></head><body>
<div class="row" style="gap:20px"><div style="width:120px;height:72px;border-radius:8px;background:var(--fp-bg-1);box-shadow:none;border:1px solid var(--fp-line-1);display:grid;place-items:center" class="t">inset</div><div style="width:120px;height:72px;border-radius:8px;background:var(--fp-bg-2);box-shadow:var(--fp-shadow-node);border:1px solid var(--fp-line-1);display:grid;place-items:center" class="t">node</div><div style="width:120px;height:72px;border-radius:12px;background:var(--fp-bg-2);box-shadow:var(--fp-shadow-pop);border:1px solid var(--fp-line-2);display:grid;place-items:center" class="t">popover</div><div style="width:120px;height:72px;border-radius:8px;background:var(--fp-bg-2);box-shadow:var(--fp-ring-select), var(--fp-shadow-node);border:1px solid var(--fp-line-1);display:grid;place-items:center" class="t">selected</div></div></body></html>
