<!-- @dsCard group="Spacing" viewport="700x100" name="Radii" subtitle="2 port · 4 field · 6 button · 8 node · 12 panel" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--fp-bg-0);color:var(--fp-fg-1);font-family:var(--fp-font-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px;width:96px}.chip{height:56px;border-radius:8px;border:1px solid var(--fp-line-1)}
.n{font-size:12px;font-weight:500}.t{font-family:var(--fp-font-mono);font-size:10px;color:var(--fp-fg-4)}.m{font-family:var(--fp-font-mono)}
.grid{display:grid;grid-template-columns:160px 1fr;gap:12px 20px;align-items:baseline}</style></head><body>
<div class="row" style="gap:20px"><div style="display:grid;gap:6px;justify-items:center"><span style="width:40px;height:40px;border:1.5px solid var(--fp-line-3);border-radius:2px"></span><span class="t">2 port</span></div><div style="display:grid;gap:6px;justify-items:center"><span style="width:40px;height:40px;border:1.5px solid var(--fp-line-3);border-radius:4px"></span><span class="t">4 field</span></div><div style="display:grid;gap:6px;justify-items:center"><span style="width:40px;height:40px;border:1.5px solid var(--fp-line-3);border-radius:6px"></span><span class="t">6 button</span></div><div style="display:grid;gap:6px;justify-items:center"><span style="width:40px;height:40px;border:1.5px solid var(--fp-line-3);border-radius:8px"></span><span class="t">8 node</span></div><div style="display:grid;gap:6px;justify-items:center"><span style="width:40px;height:40px;border:1.5px solid var(--fp-line-3);border-radius:12px"></span><span class="t">12 panel</span></div><div style="display:grid;gap:6px;justify-items:center"><span style="width:56px;height:40px;border:1.5px solid var(--fp-line-3);border-radius:999px"></span><span class="t">full pill</span></div></div></body></html>
