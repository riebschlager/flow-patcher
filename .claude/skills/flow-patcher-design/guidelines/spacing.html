<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--fp-bg-0);color:var(--fp-fg-1);font-family:var(--fp-font-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px;width:96px}.chip{height:56px;border-radius:8px;border:1px solid var(--fp-line-1)}
.n{font-size:12px;font-weight:500}.t{font-family:var(--fp-font-mono);font-size:10px;color:var(--fp-fg-4)}.m{font-family:var(--fp-font-mono)}
.grid{display:grid;grid-template-columns:160px 1fr;gap:12px 20px;align-items:baseline}</style></head><body>
