<!-- @dsCard group="Brand" viewport="700x200" name="Port shapes and cables" subtitle="Color plus shape per type" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--fp-bg-0);color:var(--fp-fg-1);font-family:var(--fp-font-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px;width:96px}.chip{height:56px;border-radius:8px;border:1px solid var(--fp-line-1)}
.n{font-size:12px;font-weight:500}.t{font-family:var(--fp-font-mono);font-size:10px;color:var(--fp-fg-4)}.m{font-family:var(--fp-font-mono)}
.grid{display:grid;grid-template-columns:160px 1fr;gap:12px 20px;align-items:baseline}</style></head><body>
<div style="display:grid;gap:10px"><div style="display:grid;grid-template-columns:24px 70px 160px 1fr;gap:14px;align-items:center"><span style="width:9px;height:9px;transform:rotate(45deg);border-radius:1.5px;background:var(--fp-event)"></span><span class="n" style="color:var(--fp-event)">Event</span><svg width="160" height="10"><line x1="1" y1="5" x2="160" y2="5" stroke="var(--fp-event)" stroke-dasharray="3 3" stroke-width="1.5"></line></svg><span style="font-size:11px;color:var(--fp-fg-3)">◆ filled · short dash</span></div><div style="display:grid;grid-template-columns:24px 70px 160px 1fr;gap:14px;align-items:center"><span style="width:9px;height:9px;transform:rotate(45deg);border-radius:1.5px;box-shadow:inset 0 0 0 2.5px var(--fp-note)"></span><span class="n" style="color:var(--fp-note)">Note</span><svg width="160" height="10"><line x1="1" y1="5" x2="160" y2="5" stroke="var(--fp-note)" stroke-dasharray="8 3" stroke-width="1.5"></line></svg><span style="font-size:11px;color:var(--fp-fg-3)">◇ open · long dash</span></div><div style="display:grid;grid-template-columns:24px 70px 160px 1fr;gap:14px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--fp-signal)"></span><span class="n" style="color:var(--fp-signal)">Signal</span><svg width="160" height="10"><line x1="1" y1="5" x2="160" y2="5" stroke="var(--fp-signal)" stroke-width="1.5"></line></svg><span style="font-size:11px;color:var(--fp-fg-3)">● · hairline</span></div><div style="display:grid;grid-template-columns:24px 70px 160px 1fr;gap:14px;align-items:center"><span style="width:13px;height:8px;border-radius:4px;background:var(--fp-audio)"></span><span class="n" style="color:var(--fp-audio)">Audio</span><svg width="160" height="10"><line x1="1" y1="5" x2="160" y2="5" stroke="var(--fp-audio)" stroke-width="3" stroke-linecap="round"></line></svg><span style="font-size:11px;color:var(--fp-fg-3)">pill · 3px</span></div><div style="display:grid;grid-template-columns:24px 70px 160px 1fr;gap:14px;align-items:center"><span style="width:10px;height:10px;border-radius:2px;background:var(--fp-field)"></span><span class="n" style="color:var(--fp-field)">Field</span><svg width="160" height="10"><line x1="1" y1="5" x2="160" y2="5" stroke="var(--fp-field)" stroke-width="5"></line><line x1="0" y1="5" x2="160" y2="5" stroke="var(--fp-bg-0)" stroke-width="1.6"></line></svg><span style="font-size:11px;color:var(--fp-fg-3)">■ · double rail</span></div><div style="display:grid;grid-template-columns:24px 70px 160px 1fr;gap:14px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;border:2px solid var(--fp-value)"></span><span class="n" style="color:var(--fp-value)">Value</span><svg width="160" height="10"><line x1="1" y1="5" x2="160" y2="5" stroke="var(--fp-value)" stroke-dasharray="0.1 4.5" stroke-width="1.8" stroke-linecap="round"></line></svg><span style="font-size:11px;color:var(--fp-fg-3)">○ ring · dotted</span></div></div></body></html>
