<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--fp-bg-0);color:var(--fp-fg-1);font-family:var(--fp-font-ui);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px;width:96px}.chip{height:56px;border-radius:8px;border:1px solid var(--fp-line-1)}
.n{font-size:12px;font-weight:500}.t{font-family:var(--fp-font-mono);font-size:10px;color:var(--fp-fg-4)}.m{font-family:var(--fp-font-mono)}
.grid{display:grid;grid-template-columns:160px 1fr;gap:12px 20px;align-items:baseline}</style></head><body>
<div class="row" style="gap:8px"><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-mouse-pointer-2" style="font-size:13px;color:var(--fp-fg-3)"></i>Sources</span><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-hand" style="font-size:13px;color:var(--fp-fg-3)"></i>Gestures</span><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-timer" style="font-size:13px;color:var(--fp-fg-3)"></i>Time</span><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-music" style="font-size:13px;color:var(--fp-fg-3)"></i>Harmony</span><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-git-fork" style="font-size:13px;color:var(--fp-fg-3)"></i>Control</span><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-piano" style="font-size:13px;color:var(--fp-fg-3)"></i>Instruments</span><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-audio-waveform" style="font-size:13px;color:var(--fp-fg-3)"></i>Effects</span><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-droplets" style="font-size:13px;color:var(--fp-fg-3)"></i>Visual</span><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-speaker" style="font-size:13px;color:var(--fp-fg-3)"></i>Output</span><span style="display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;background:var(--fp-bg-1);border:1px solid var(--fp-line-1);font-size:12px;color:var(--fp-fg-2)"><i class="icon-layers" style="font-size:13px;color:var(--fp-fg-3)"></i>Subpatch</span></div></body></html>
